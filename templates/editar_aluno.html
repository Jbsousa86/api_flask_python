<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editar Aluno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1>Editar Aluno</h1>

    <form id="form-editar">
        <input type="hidden" id="id" name="id">

        <div class="mb-3">
            <label for="nome" class="form-label">Nome:</label>
            <input type="text" id="nome" name="nome" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email:</label>
            <input type="email" id="email" name="email" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="senha" class="form-label">Senha:</label>
            <input type="password" id="senha" name="senha" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary">Salvar</button>
        <a href="/gerenciar_alunos.html" class="btn btn-secondary">Cancelar</a>
    </form>
</div>

<script>
// Quando a página carregar
document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    if (id) {
        fetch(`/alunos`)
            .then(response => response.json())
            .then(alunos => {
                const aluno = alunos.find(aluno => aluno.idaluno == id);
                if (aluno) {
                    document.getElementById('id').value = aluno.idaluno;
                    document.getElementById('nome').value = aluno.nome;
                    document.getElementById('email').value = aluno.email;
                }
            })
            .catch(error => console.error('Erro ao carregar aluno:', error));
    }
});

// Quando o formulário for enviado
document.getElementById('form-editar').addEventListener('submit', (event) => {
    event.preventDefault();

    const idaluno = document.getElementById('id').value;
    const nome = document.getElementById('nome').value;
    const email = document.getElementById('email').value;
    const senha = document.getElementById('senha').value;

    fetch(`/alunos/${idaluno}`, {
        method: 'PUT',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({ nome, email, senha })
    })
    .then(response => response.json())
    .then(data => {
        alert(data.mensagem);
        window.location.href = '/gerenciar_alunos.html';
    })
    .catch(error => console.error('Erro ao atualizar aluno:', error));
});
</script>

</body>
</html>
